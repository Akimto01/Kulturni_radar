<!DOCTYPE html>
<!-- Kulturní radar Index.html v3.15 – Dvourežimový gsr(): google.script.run uvnitř Apps Scriptu, fetch() na /exec pro statické nasazení (GitHub Pages) -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kulturní radar</title>
<style>
  /* ── Tokeny ─────────────────────────────────────────────── */
  :root {
    --ink:      #1a1a2e;
    --ink-2:    #4a4a6a;
    --ink-3:    #8888aa;
    --paper:    #f7f6f2;
    --card:     #ffffff;
    --accent:   #c0392b;   /* červená jako divadelní opona */
    --accent-2: #e8d5b0;   /* pergamen – pro chipy kategorií */
    --radius:   10px;
    --mono:     'JetBrains Mono', 'Courier New', monospace;
    --sans:     'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    font-size: 16px;   /* zpětná vazba 4. 8. 2026: text byl na Androidu malý – explicitní kotva */
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Hlavička ────────────────────────────────────────────── */
  header {
    background: var(--ink);
    color: #fff;
    padding: 16px 20px 14px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  #meta-info {
    font-size: .75rem;
    color: var(--ink-3);
    font-family: var(--mono);
    margin-left: auto;
  }

  /* ── Filtry a profil ─────────────────────────────────────── */
  #controls {
    padding: 12px 20px 10px;
    background: var(--card);
    border-bottom: 1px solid #e0ddd6;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  #profil-select {
    font-family: var(--sans);
    font-size: .85rem;
    border: 1px solid #d0cdc6;
    border-radius: 6px;
    padding: 5px 10px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  #controls-oznaceni {
    padding: 8px 20px 10px;
    background: var(--card);
    border-bottom: 1px solid #e0ddd6;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;   /* zpětná vazba 4. 8. 2026: doprava, ne doleva */
  }
  .chip {
    font-size: .78rem;
    padding: 4px 11px;
    border-radius: 20px;
    border: 1.5px solid var(--accent-2);
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    font-family: var(--sans);
  }
  .chip.active, .chip:hover {
    background: var(--accent-2);
    border-color: #c8a870;
    color: var(--ink);
  }
  .chip-special.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  #obdobi-select {
    font-family: var(--sans);
    font-size: .78rem;
    border: 1.5px solid var(--accent-2);
    border-radius: 20px;
    padding: 3px 10px;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }

  /* ── Akce: skupiny po dnech ──────────────────────────────── */
  main { padding: 16px 16px 80px; max-width: 700px; margin: 0 auto; }

  .den-hlavicka {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 24px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid #e0ddd6;
  }
  .den-hlavicka:first-child { margin-top: 8px; }

  .karta {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px 12px;
    margin-bottom: 8px;
    border-left: 3px solid transparent;
    transition: border-color .15s, box-shadow .15s;
    position: relative;
  }
  .karta:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .karta.zruseno { opacity: .5; border-left-color: var(--ink-3) !important; }
  .karta.zruseno .nazev { text-decoration: line-through; }

  /* Barvy kategorií */
  .karta[data-kat="koncerty"]            { border-left-color: #9b59b6; }
  .karta[data-kat="festivaly"]           { border-left-color: #e67e22; }
  .karta[data-kat="výstavy"]             { border-left-color: #27ae60; }
  .karta[data-kat="divadlo"]             { border-left-color: var(--accent); }
  .karta[data-kat="historické slavnosti"]{ border-left-color: #8b6914; }
  .karta[data-kat="folklor"]             { border-left-color: #16a085; }

  .karta-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .nazev { font-size: 1rem; font-weight: 600; line-height: 1.35; }
  .karta-top-vpravo { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .skore {
    font-family: var(--mono);
    font-size: .7rem;
    background: var(--paper);
    border-radius: 4px;
    padding: 2px 6px;
    color: var(--ink-2);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ikona-oznaceni {
    font-size: 1.05rem;
    line-height: 1;
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 3px;
    color: var(--ink-3);
    font-family: var(--sans);
  }
  .ikona-oznaceni:hover { color: var(--ink-2); }
  .ikona-oznaceni.aktivni.hvezda { color: #d4a017; }
  .ikona-oznaceni.aktivni.fajfka { color: #27ae60; }
  .ikona-oznaceni.ukladani { opacity: .35; pointer-events: none; }
  .navstiveno-info { color: #27ae60 !important; }
  .meta {
    margin-top: 5px;
    font-size: .85rem;
    color: var(--ink-2);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .meta span::before { content: ''; }
  .kat-badge {
    font-size: .68rem;
    background: var(--accent-2);
    color: #7a5c2e;
    padding: 1px 7px;
    border-radius: 20px;
    font-weight: 500;
  }
  .popis {
    margin-top: 6px;
    font-size: .88rem;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .karta-akce {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn-url {
    font-size: .75rem;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #d0cdc6;
    background: var(--paper);
    color: var(--ink-2);
    text-decoration: none;
    font-family: var(--sans);
  }
  .btn-url:hover { background: var(--accent-2); color: var(--ink); }

  /* ── Stálá místa ─────────────────────────────────────────── */
  #mista-sekce { margin-top: 8px; }
  .misto-karta {
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .misto-nazev { font-weight: 600; font-size: .95rem; }
  .misto-meta { font-size: .82rem; color: var(--ink-2); margin-top: 3px; }
  .misto-skore {
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--ink-3);
    white-space: nowrap;
  }

  /* ── Stavové zprávy ──────────────────────────────────────── */
  #status {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-3);
    font-size: .9rem;
  }

  /* ── Tlačítko spustit ────────────────────────────────────── */
  #fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 12px 22px;
    font-size: .85rem;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(192,57,43,.35);
    transition: transform .1s, box-shadow .1s;
    z-index: 100;
  }
  #fab:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(192,57,43,.4); }
  #fab:disabled { background: var(--ink-3); box-shadow: none; transform: none; cursor: default; }

  /* ── Sekce záhlaví ───────────────────────────────────────── */
  .sekce-label {
    font-size: .8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-2);
    margin: 28px 0 10px;
  }

  /* ── Token dialog ────────────────────────────────────────── */
  #token-dialog {
    display: none;
    position: fixed; inset: 0;
    background: rgba(26,26,46,.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #token-dialog.open { display: flex; }
  #token-box {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    width: min(340px, 90vw);
  }
  #token-box h2 { font-size: 1rem; margin-bottom: 12px; }
  #token-box p { font-size: .82rem; color: var(--ink-2); margin-bottom: 14px; }
  #token-input {
    width: 100%; padding: 9px 12px;
    border: 1.5px solid #d0cdc6; border-radius: 6px;
    font-family: var(--mono); font-size: .85rem;
    margin-bottom: 12px;
  }
  .dialog-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-cancel {
    padding: 8px 16px; border: 1px solid #d0cdc6; border-radius: 6px;
    background: transparent; cursor: pointer; font-family: var(--sans); font-size: .82rem;
  }
  .btn-ok {
    padding: 8px 16px; border: none; border-radius: 6px;
    background: var(--accent); color: #fff; cursor: pointer;
    font-family: var(--sans); font-size: .82rem; font-weight: 600;
  }

  /* ── v3.13: Přihlášení uživatelského profilu ─────────────── */
  #login-overlay {
    position: fixed; inset: 0;
    background: var(--paper);
    z-index: 300;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
  }
  #login-overlay.skryto { display: none; }
  #login-overlay h2 { font-size: 1.15rem; }
  #login-overlay .login-pokyn { font-size: .85rem; color: var(--ink-2); }
  #login-dlazdice {
    display: flex; flex-wrap: wrap; gap: 12px;
    justify-content: center; max-width: 420px;
  }
  .dlazdice-uzivatel {
    padding: 18px 22px; min-width: 120px;
    background: var(--card); border: 1.5px solid #d0cdc6;
    border-radius: var(--radius); cursor: pointer;
    font-family: var(--sans); font-size: 1rem; font-weight: 600;
    color: var(--ink);
  }
  .dlazdice-uzivatel:hover, .dlazdice-uzivatel.vybrana {
    border-color: var(--accent); color: var(--accent);
  }
  #login-pin-sekce { display: none; flex-direction: column; gap: 10px; align-items: center; }
  #login-pin-sekce.zobrazit { display: flex; }
  #login-pin {
    width: 160px; padding: 10px 12px; text-align: center;
    border: 1.5px solid #d0cdc6; border-radius: 6px;
    font-family: var(--mono); font-size: 1.1rem; letter-spacing: .3em;
  }
  #login-chyba { color: var(--accent); font-size: .82rem; min-height: 1.2em; }

  /* v3.13: badge přihlášeného uživatele v hlavičce */
  #uzivatel-badge {
    background: transparent; border: 1px solid rgba(255,255,255,.5);
    border-radius: 999px; padding: 4px 12px;
    color: inherit; font-family: var(--sans); font-size: .78rem;
    cursor: pointer; white-space: nowrap;
  }

  /* v3.13: dialog osobních filtrů (sdílí vzhled s token dialogem) */
  #filtry-dialog {
    display: none; position: fixed; inset: 0;
    background: rgba(26,26,46,.6); z-index: 200;
    align-items: center; justify-content: center;
  }
  #filtry-dialog.open { display: flex; }
  #filtry-box {
    background: var(--card); border-radius: var(--radius);
    padding: 28px 24px; width: min(380px, 92vw);
  }
  #filtry-box h2 { font-size: 1rem; margin-bottom: 12px; }
  #filtry-box label { display: block; font-size: .78rem; color: var(--ink-2); margin: 10px 0 4px; }
  #filtry-box input {
    width: 100%; padding: 9px 12px;
    border: 1.5px solid #d0cdc6; border-radius: 6px;
    font-family: var(--sans); font-size: .85rem;
  }
  #filtry-box .filtry-akce-radek { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn-hledat {
    padding: 8px 16px; border: 1px solid var(--accent); border-radius: 6px;
    background: transparent; color: var(--accent); cursor: pointer;
    font-family: var(--sans); font-size: .82rem; font-weight: 600;
  }

  @media (max-width: 480px) {
    header { padding: 12px 14px; }
    main { padding: 12px 10px 80px; }
    #controls { padding: 10px 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎭 Kulturní radar</h1>
  <span id="meta-info">načítám…</span>
  <button id="uzivatel-badge" title="Přihlásit se k osobnímu profilu">Přihlásit se</button>
</header>

<div id="controls">
  <select id="profil-select" title="Aktivní profil"></select>
  <div class="chips" id="kat-chips"></div>
</div>

<div id="controls-oznaceni">
  <div class="chips">
    <button id="chip-oblibene" class="chip chip-special">★ Oblíbené</button>
    <button id="chip-navstivene" class="chip chip-special">✓ Navštívené</button>
  </div>
  <select id="obdobi-select" style="display:none">
    <option value="30">poslední měsíc</option>
    <option value="90">poslední 3 měsíce</option>
    <option value="180">posledních 6 měsíců</option>
    <option value="365">poslední rok</option>
    <option value="vse" selected>vše</option>
  </select>
</div>

<main id="main">
  <div id="status">Načítám akce…</div>
</main>

<button id="fab" title="Spustit vyhledávání nových akcí">Spustit kontrolu</button>

<!-- v3.13: Přihlášení uživatelského profilu (overlay); v3.14: skrytý na startu,
     zobrazuje se až na vyžádání (badge, nebo pokus o ★/✓ bez přihlášení) -->
<div id="login-overlay" class="skryto">
  <h2>🎭 Kulturní radar</h2>
  <span class="login-pokyn" id="login-duvod">Kdo se dívá? Vyber svůj profil.</span>
  <div id="login-dlazdice"><span class="login-pokyn">Načítám profily…</span></div>
  <div id="login-pin-sekce">
    <input id="login-pin" type="password" inputmode="numeric" autocomplete="off"
           placeholder="PIN" aria-label="PIN vybraného profilu">
    <div id="login-chyba"></div>
    <div class="dialog-btns">
      <button class="btn-cancel" id="login-zpet">Zpět</button>
      <button class="btn-ok" id="login-potvrdit">Přihlásit</button>
    </div>
  </div>
  <button class="btn-cancel" id="login-pokracovat-bez">Pokračovat bez přihlášení</button>
</div>

<!-- v3.13: Dialog osobních filtrů + hledání na vyžádání -->
<div id="filtry-dialog" role="dialog" aria-modal="true" aria-label="Osobní filtry profilu">
  <div id="filtry-box">
    <h2 id="filtry-nadpis">Můj profil</h2>
    <label for="filtry-kategorie">Kategorie (oddělené středníkem, prázdné = výchozí)</label>
    <input id="filtry-kategorie" type="text" placeholder="např. koncerty; festivaly; dětské">
    <label for="filtry-dojezd">Maximální dojezd (prázdné = výchozí)</label>
    <input id="filtry-dojezd" type="text" placeholder="např. 60 min">
    <div class="filtry-akce-radek">
      <button class="btn-cancel" id="filtry-odhlasit">Odhlásit</button>
      <button class="btn-cancel" id="filtry-zavrit">Zavřít</button>
      <button class="btn-hledat" id="filtry-hledat" title="Spustí AI hledání s tvými filtry (vyžaduje token)">Najít akce pro mě</button>
      <button class="btn-ok" id="filtry-ulozit">Uložit</button>
    </div>
  </div>
</div>

<!-- Token dialog -->
<div id="token-dialog" role="dialog" aria-modal="true" aria-label="Zadej přístupový token">
  <div id="token-box">
    <h2>Přístupový token</h2>
    <p>Token nastavuje správce v Apps Script → Script Properties → WEB_TOKEN.</p>
    <input id="token-input" type="password" placeholder="vložit token…" autocomplete="off">
    <div class="dialog-btns">
      <button class="btn-cancel" id="token-cancel">Zrušit</button>
      <button class="btn-ok" id="token-ok">Spustit</button>
    </div>
  </div>
</div>

<script>
  // ── Stav ──────────────────────────────────────────────────
  let vsechnaAkce = [];
  let aktKategorie = new Set();
  let aktivniProfil = '';
  let token = localStorage.getItem('radar_token') || '';
  let rezimZobrazeni = 'vse';       // 'vse' | 'oblibene' | 'navstivene'
  let obdobiNavstivene = 'vse';     // '30' | '90' | '180' | '365' | 'vse'
  // v3.13: přihlášený uživatelský profil – JEN v paměti (rozhodnutí 7. 8. 2026:
  // PIN se zadává při každém vstupu na web, žádné localStorage přihlášení).
  let prihlasenyUzivatel = null;    // { id, jmeno, filtry } | null

  // ── v3.13: čisté funkce uživatelských profilů (testovatelné bez DOM) ──
  /** Z textových polí formuláře sestaví objekt filtrů; prázdné hodnoty se
   *  vynechají (= použije se výchozí z KRITÉRIÍ). */
  function sestavFiltry_(kategorieText, dojezdText) {
    const filtry = {};
    const kat = String(kategorieText == null ? '' : kategorieText).trim();
    const doj = String(dojezdText == null ? '' : dojezdText).trim();
    if (kat) filtry.kategorie = kat;
    if (doj) filtry.dojezd = doj;
    return filtry;
  }

  /** Základní kontrola PINu před odesláním: 4–8 znaků bez mezer. */
  function pinVypadaPlatne_(pin) {
    const p = String(pin == null ? '' : pin).trim();
    return p.length >= 4 && p.length <= 8 && !/\s/.test(p);
  }

  // ── Načtení dat: dvourežimový most na server (v3.15) ──────
  // Uvnitř Apps Scriptu (dnešní /exec) existuje google.script.run – nativní
  // bridge. Na statickém hostingu (GitHub Pages / kulturniradar.cz) ale
  // neexistuje, tam se stejná volání překládají na fetch() proti EXEC_URL.
  // Jeden Index.html tak beze změny funguje v obou prostředích.
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbwwLACExWtRUULK5XX1bMD8SJiC6cBqAY-q99Flp3SLAEr4ejB4VnekFNH9yYnlOuJvRQ/exec';
  const JE_V_APPS_SCRIPTU = typeof google !== 'undefined' && google.script && google.script.run;

  /** PURE: přeloží volání serverové funkce na popis HTTP požadavku
   *  ({metoda, url} pro GET, {metoda, url, telo} pro POST). PIN a token jdou
   *  POSTem záměrně – nepatří do URL (historie prohlížeče, serverové logy).
   *  Vrací null pro neznámou funkci. Bez fetch/DOM – testovatelné v Node. */
  function sestavFetchPozadavek_(fn, args, execUrl) {
    const a = args || [];
    switch (fn) {
      case 'apiMeta':
        return { metoda: 'GET', url: execUrl + '?api=meta' };
      case 'apiEvents':
        return { metoda: 'GET', url: execUrl + '?api=events'
          + '&profil=' + encodeURIComponent(a[0] || '')
          + (a[1] ? '&oznacene=1' : '')
          + '&uzivatel=' + encodeURIComponent(a[2] || '') };
      case 'apiPlaces':
        return { metoda: 'GET', url: execUrl + '?api=places&profil=' + encodeURIComponent(a[0] || '') };
      case 'apiSeznamUzivatelu':
        return { metoda: 'GET', url: execUrl + '?api=uzivatele' };
      case 'apiPrihlaseniUzivatele':
        return { metoda: 'POST', url: execUrl, telo: { akce: 'login', uzivatelId: a[0], pin: a[1] } };
      case 'apiToggle':
        return { metoda: 'POST', url: execUrl, telo: { akce: 'toggle', id: a[0], typ: a[1], uzivatelId: a[2] } };
      case 'apiSetFiltry':
        return { metoda: 'POST', url: execUrl, telo: { akce: 'filtry', uzivatelId: a[0], filtry: a[1] } };
      case 'apiNajdiProUzivatele':
        return { metoda: 'POST', url: execUrl, telo: { akce: 'najdi', uzivatelId: a[0], token: a[1] } };
      case 'apiSpustKontrolu':
        return { metoda: 'POST', url: execUrl, telo: { akce: 'run', token: a[0] } };
      default:
        return null;
    }
  }

  async function gsrPresFetch_(fn, args) {
    const poz = sestavFetchPozadavek_(fn, args, EXEC_URL);
    if (!poz) throw new Error('Neznámá serverová funkce: ' + fn);
    // Content-Type text/plain: jednoduchý požadavek bez CORS preflight –
    // přesně varianta ověřená CORS spikem 7. 8. 2026 (GET i POST prošly).
    const opts = poz.metoda === 'POST'
      ? { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(poz.telo) }
      : undefined;
    const resp = await fetch(poz.url, opts);
    if (!resp.ok) throw new Error('Server vrátil HTTP ' + resp.status);
    return resp.json();
  }

  function gsr(fn, ...args) {
    if (JE_V_APPS_SCRIPTU) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [fn](...args);
      });
    }
    return gsrPresFetch_(fn, args);
  }

  async function api(endpoint, param = '') {
    const profil = param.replace('profil=', '');
    if (endpoint === 'meta')   return gsr('apiMeta');
    if (endpoint === 'events') return gsr('apiEvents', profil, true,
      prihlasenyUzivatel ? prihlasenyUzivatel.id : '');   // vždy i s označenými, filtrujeme v UI; ★/✓ per profil
    if (endpoint === 'places') return gsr('apiPlaces', profil);
    throw new Error('Neznámý endpoint: ' + endpoint);
  }

  // ── v3.13: Přihlášení uživatelského profilu ───────────────
  // v3.14: overlay je na startu skrytý – appka běží anonymně a login se
  // otevírá až na vyžádání (badge, nebo pokus o ★/✓ bez přihlášení).
  let vybranyUzivatelId = '';
  let dlazdiceNactene = false;

  /** Otevře přihlašovací obrazovku; duvod (volitelný) se ukáže místo
   *  standardního "Kdo se dívá?" – např. u pokusu o ★ bez přihlášení. */
  function otevritLogin(duvod) {
    document.getElementById('login-duvod').textContent =
      duvod || 'Kdo se dívá? Vyber svůj profil.';
    document.getElementById('login-chyba').textContent = '';
    document.getElementById('login-overlay').classList.remove('skryto');

  function zavritLogin() {
    document.getElementById('login-overlay').classList.add('skryto');
    vybranyUzivatelId = '';
    document.querySelectorAll('.dlazdice-uzivatel').forEach(x => x.classList.remove('vybrana'));
    document.getElementById('login-pin-sekce').classList.remove('zobrazit');
    document.getElementById('login-pin').value = '';

  async function zobrazitLogin() {
    const kontejner = document.getElementById('login-dlazdice');
    try {
      const seznam = await gsr('apiSeznamUzivatelu');
      kontejner.innerHTML = '';
      if (!seznam || !seznam.length) {
        kontejner.innerHTML = '<span class="login-pokyn">Žádné profily – správce je musí založit v tabulce (menu Kulturní radar → Nastavit uživatelské profily).</span>';
        return;
      }
      seznam.forEach(u => {
        const d = document.createElement('button');
        d.className = 'dlazdice-uzivatel';
        d.dataset.uzivatelId = u.id;   // v3.13→doplněk: stabilní selektor pro RF testy (jméno se může měnit)
        d.textContent = u.jmeno || u.id;
        d.addEventListener('click', () => {
          vybranyUzivatelId = u.id;
          document.querySelectorAll('.dlazdice-uzivatel').forEach(x => x.classList.remove('vybrana'));
          d.classList.add('vybrana');
          document.getElementById('login-pin-sekce').classList.add('zobrazit');
          document.getElementById('login-chyba').textContent = '';
          document.getElementById('login-pin').value = '';
          document.getElementById('login-pin').focus();
        });
        kontejner.appendChild(d);
      });
      dlazdiceNactene = true;
    } catch (e) {
      kontejner.innerHTML = '<span class="login-pokyn">Profily se nepodařilo načíst: ' + e.message + '</span>';
    }

  async function prihlasit_() {
    const pin = document.getElementById('login-pin').value;
    const chyba = document.getElementById('login-chyba');
    if (!vybranyUzivatelId) { chyba.textContent = 'Nejdřív vyber profil.'; return; }
    if (!pinVypadaPlatne_(pin)) { chyba.textContent = 'PIN má mít 4–8 znaků bez mezer.'; return; }
    const btn = document.getElementById('login-potvrdit');
    btn.disabled = true; chyba.textContent = '';
    try {
      const res = await gsr('apiPrihlaseniUzivatele', vybranyUzivatelId, pin);
      if (res && res.ok) {
        prihlasenyUzivatel = { id: res.id, jmeno: res.jmeno, filtry: res.filtry || {} };
        // v3.14→oprava: nactiAkce (osobní ★/✓) MUSÍ doběhnout PŘED zavřením
        // overlaye, jinak hrozí race condition – klik na kartu hned po
        // přihlášení mohl zasáhnout element, který vzápětí přepsal ještě
        // doběhající přechod anonymní→osobní data (ztráta optimistického
        // zápisu, karty zmizely z filtru „★ Oblíbené" i po úspěšném apiToggle).
        const sel = document.getElementById('profil-select');
        await nactiAkce((sel && sel.value) || aktivniProfil);
        zavritLogin();
        const badge = document.getElementById('uzivatel-badge');
        badge.textContent = '👤 ' + res.jmeno;
        badge.title = 'Profil – filtry, hledání, odhlášení';
      } else {
        chyba.textContent = (res && res.error) || 'Přihlášení se nepodařilo.';
      }
    } catch (e) {
      chyba.textContent = 'Chyba: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('login-potvrdit').addEventListener('click', prihlasit_);
  document.getElementById('login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') prihlasit_(); });
  document.getElementById('login-zpet').addEventListener('click', () => {

  function odhlasit_() {
    // v3.13→oprava: location.reload() uvnitř sandboxovaného Apps Script

  // ── v3.13: Dialog osobních filtrů + hledání na vyžádání ───

  document.getElementById('filtry-hledat').addEventListener('click', async () => {

    // v3.13→oprava: dřív se spustilo hledání s POSLEDNÍ ULOŽENOU hodnotou
    // filtrů, ne s tím, co je právě napsané v poli (kdo nekliknul napřed na
    // "Uložit", hledalo se s prázdnými/starými filtry beze změny – přesně
    // tohle potkalo Vojtu 7. 8. s dojezdem). Řešení: před spuštěním hledání
    // vždy nejdřív uložit aktuální obsah polí, ne jen spoléhat na dřívější uložení.
    const filtry = sestavFiltry_(
      document.getElementById('filtry-kategorie').value,
      document.getElementById('filtry-dojezd').value);
    try {
      const ulozeno = await gsr('apiSetFiltry', prihlasenyUzivatel.id, filtry);
      if (!ulozeno || !ulozeno.ok) {
        alert((ulozeno && ulozeno.error) || 'Filtry se nepodařilo uložit, hledání se nespustilo.');
        return;
      }
      prihlasenyUzivatel.filtry = filtry;
    } catch (e) {
      alert('Chyba při ukládání filtrů: ' + e.message);
      return;
    }

    document.getElementById('filtry-dialog').classList.remove('open');
    if (!token) {
      // Stejný token dialog jako FAB – po zadání se ale spustí osobní hledání.
      poTokenu = spustitOsobniHledani_;
      document.getElementById('token-dialog').classList.add('open');
    } else {

  async function spustitOsobniHledani_(tok) {
    const fab = document.getElementById('fab');
    fab.disabled = true;
    fab.textContent = 'Hledám pro ' + prihlasenyUzivatel.jmeno + '…';
    try {
      const d = await gsr('apiNajdiProUzivatele', prihlasenyUzivatel.id, tok);
      if (d && d.ok) {
        fab.textContent = 'Nalezeno: ' + (d.nove || 0) + ' nových ✓';
        await nactiAkce(document.getElementById('profil-select').value || aktivniProfil);
        setTimeout(() => { fab.disabled = false; fab.textContent = 'Spustit kontrolu'; }, 8000);
      } else {
        alert((d && d.error) || 'Hledání se nepodařilo.');
        fab.disabled = false;
        fab.textContent = 'Spustit kontrolu';
        if (d && d.error && d.error.includes('token')) {
          localStorage.removeItem('radar_token');
          token = '';
        }
      }
    } catch (e) {
      alert('Chyba: ' + e.message);
      fab.disabled = false;
      fab.textContent = 'Spustit kontrolu';
    }
  }

  // v3.13→oprava: init() se teď volá vícekrát (jednou po každém přihlášení),
  // ne jen jednou při načtení stránky jako dřív. Bez téhle pojistky by se
  // listenery na statických prvcích (chip-oblibene, chip-navstivene,
  // obdobi-select, profil-select) skládaly na sebe s každým dalším
  // přihlášením – druhé by kliky spouštělo 2×, třetí 3× atd.
  let posluchaceStatickychPrvkuNastaveny = false;

  async function init() {
    try {
      const meta = await api('meta');
      aktivniProfil = meta.aktivniProfil || '';

      // Profily do selectu – seřazené abecedně (zpětná vazba 5. 8. 2026:
      // dřív v pořadí, jak je vrátil list LOKALITY, což se hůř hledá)
      const sel = document.getElementById('profil-select');
      sel.innerHTML = '';   // v3.13→oprava: jinak se možnosti při druhém init() zdvojí
      const profilySerazene = [...(meta.profily || [])].sort((a, b) =>
        String(a.profil).localeCompare(String(b.profil), 'cs'));
      profilySerazene.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.profil;
        opt.textContent = p.profil + (p.kraj ? ' · ' + p.kraj : '');
        if (p.profil === aktivniProfil) opt.selected = true;
        sel.appendChild(opt);
      });

      // Kategorie chipy
      const chips = document.getElementById('kat-chips');
      chips.innerHTML = '';   // v3.13→oprava: jinak se chipy při druhém init() zdvojí
      const vseChip = vytvorChip('Vše', true);
      vseChip.addEventListener('click', () => {
        aktKategorie.clear();
        rezimZobrazeni = 'vse';
        prekreslit();
      });
      chips.appendChild(vseChip);
      (meta.kategorie || []).forEach(k => {
        const ch = vytvorChip(k, false);
        ch.addEventListener('click', () => toggleKat(k));
        chips.appendChild(ch);
      });

      // Listenery na STATICKÝCH prvcích (existují jen jednou v DOM, nemažou
      // se) – přidat jen při úplně prvním init() za život stránky.
      if (!posluchaceStatickychPrvkuNastaveny) {
        sel.addEventListener('change', () => {
          rezimZobrazeni = 'vse';
          nactiAkce(sel.value);
          nactiMista(sel.value);   // BUG oprava 5. 8. 2026: dřív se neaktualizovala při přepnutí města
        });
        document.getElementById('chip-oblibene').addEventListener('click', () => {
          rezimZobrazeni = rezimZobrazeni === 'oblibene' ? 'vse' : 'oblibene';
          prekreslit();
        });
        document.getElementById('chip-navstivene').addEventListener('click', () => {
          rezimZobrazeni = rezimZobrazeni === 'navstivene' ? 'vse' : 'navstivene';
          prekreslit();
        });
        document.getElementById('obdobi-select').addEventListener('change', (e) => {
          obdobiNavstivene = e.target.value;
          prekreslit();
        });
        posluchaceStatickychPrvkuNastaveny = true;
      }

      // Meta info
      document.getElementById('meta-info').textContent =
        meta.posledniKontrola ? 'poslední kontrola: ' + meta.posledniKontrola : 'v' + (meta.verze || '');

      await nactiAkce(aktivniProfil);
      await nactiMista(aktivniProfil);
    } catch (e) {
      zobrazitStatus_('Chyba načítání: ' + e.message);
    }
  }

  /** Zobrazí stavovou hlášku v #main. BUG opravený 5. 8. 2026: statický
   *  #status z počátečního HTML smaže renderAkce() při prvním úspěšném
   *  vykreslení (čistí #main od všeho kromě #mista-sekce) – každé DALŠÍ
   *  volání nactiAkce (přepnutí profilu) tak narazilo na getElementById
   *  vracející null a spadlo ještě před try blokem, TICHO (async funkce
   *  bez awaitu na volající straně = odmítnutý Promise, ne viditelná
   *  chyba). Appka pak na přepnutí města nereagovala vůbec. Řešení: prvek
   *  vytvořit znovu, pokud chybí, místo spoléhat na jeho trvalou existenci. */
  function zobrazitStatus_(text) {
    let el = document.getElementById('status');
    if (!el) {
      el = document.createElement('div');
      el.id = 'status';
      document.getElementById('main').prepend(el);
    }
    el.textContent = text;
  }

  async function nactiAkce(profil) {
    zobrazitStatus_('Načítám…');
    try {
      const data = await api('events', profil ? 'profil=' + encodeURIComponent(profil) : '');
      vsechnaAkce = data.akce || [];
      prekreslit();
      if (data.generovano) {
        document.getElementById('meta-info').textContent = 'načteno: ' + data.generovano;
      }
    } catch (e) {
      zobrazitStatus_('Chyba: ' + e.message);
    }
  }

  async function nactiMista(profil) {
    try {
      const data = await api('places', profil ? 'profil=' + encodeURIComponent(profil) : '');
      renderMista(data.mista || []);
    } catch (_) { /* místa jsou bonus, selhání nekritické */ }
  }

  // ── Render akcí ───────────────────────────────────────────
  function renderAkce() {
    const main = document.getElementById('main');
    // Zachovat sekci míst (a případně ji odkrýt, pokud byla skrytá speciálním pohledem)
    const mistaEl = document.getElementById('mista-sekce');
    if (mistaEl) mistaEl.style.display = '';

    // Proběhlé akce se v běžném pohledu neukazují – ty patří jen do „✓ Navštívené“
    // (server je vrací navíc jen proto, aby tam mohly být zobrazeny jako inspirace).
    const bezProbehlych = vsechnaAkce.filter(a => a.stav !== 'proběhlo');
    const filtrovane = aktKategorie.size === 0
      ? bezProbehlych
      : bezProbehlych.filter(a => a.kategorie.some(k => aktKategorie.has(k)));

    // Odstranit staré akce (ne místa)
    [...main.children].forEach(ch => {
      if (ch.id !== 'mista-sekce') ch.remove();
    });

    if (filtrovane.length === 0) {
      const el = document.createElement('div');
      el.id = 'status';
      el.textContent = 'Žádné akce pro vybraný filtr.';
      main.prepend(el);
      return;
    }

    // Skupinovat po dnech; akce začínající v minulosti (dlouhodobé /
    // opakované) nepatří pod dávno minulou denní hlavičku, ale do
    // sekce „Probíhá / dlouhodobé“ na začátku seznamu (v3.3).
    const dnes = new Date();
    dnes.setHours(0, 0, 0, 0);
    const probiha = [];
    const dnove = {};
    filtrovane.forEach(a => {
      const den = a.datumOd || '—';
      const d = parseCeskeDatum(den);
      if (d && d < dnes) { probiha.push(a); return; }
      (dnove[den] = dnove[den] || []).push(a);
    });

    const fragment = document.createDocumentFragment();
    if (probiha.length) {
      const h = document.createElement('div');
      h.className = 'den-hlavicka';
      h.textContent = 'Probíhá / dlouhodobé';
      fragment.appendChild(h);
      probiha.forEach(a => fragment.appendChild(vytvorKartu(a, true)));
    }
    Object.entries(dnove).forEach(([den, akce]) => {
      const h = document.createElement('div');
      h.className = 'den-hlavicka';
      h.textContent = den;
      fragment.appendChild(h);
      akce.forEach(a => fragment.appendChild(vytvorKartu(a)));
    });

    main.prepend(fragment);
  }

  // „d. M. yyyy" → Date (půlnoc), jinak null. Toleruje mezery kolem teček.
  function parseCeskeDatum(s) {
    const m = /^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})$/.exec((s || '').trim());
    if (!m) return null;
    return new Date(+m[3], +m[2] - 1, +m[1]);
  }

  /** Plochý seznam bez denních hlaviček – pro ★ Oblíbené a ✓ Navštívené. */
  function renderSpecialni(seznam, prazdnyText) {
    const main = document.getElementById('main');
    const mistaEl = document.getElementById('mista-sekce');
    if (mistaEl) mistaEl.style.display = 'none';   // stálá místa sem nepatří

    [...main.children].forEach(ch => { if (ch.id !== 'mista-sekce') ch.remove(); });

    if (seznam.length === 0) {
      const el = document.createElement('div');
      el.id = 'status';
      el.textContent = prazdnyText;
      main.prepend(el);
      return;
    }

    const fragment = document.createDocumentFragment();
    seznam.forEach(a => fragment.appendChild(vytvorKartu(a, { datumLabel: a.datumOd })));
    main.prepend(fragment);
  }

  function vytvorKartu(a, opts) {
    const el = document.createElement('div');
    el.className = 'karta' + (a.stav === 'zrušeno' ? ' zruseno' : '');
    const kat0 = (a.kategorie[0] || '').toLowerCase();
    el.dataset.kat = kat0;
    el.dataset.id = a.id || '';

    const jeProbiha = opts === true;                                  // legacy: sekce „Probíhá / dlouhodobé“
    const datumLabel = (opts && typeof opts === 'object') ? opts.datumLabel : null;  // ★/✓ flat seznamy

    const top = document.createElement('div');
    top.className = 'karta-top';
    const nazev = document.createElement('div');
    nazev.className = 'nazev';
    nazev.textContent = a.nazev;

    const vpravo = document.createElement('div');
    vpravo.className = 'karta-top-vpravo';
    const skore = document.createElement('div');
    skore.className = 'skore';
    skore.textContent = '★ ' + (a.skore || '—');

    const btnOblibene = document.createElement('button');
    btnOblibene.className = 'ikona-oznaceni hvezda'
      + (a.oblibene ? ' aktivni' : '')
      + (probihaUkladani.has(a.id + ':oblibene') ? ' ukladani' : '');
    btnOblibene.type = 'button';
    btnOblibene.title = a.oblibene ? 'Odebrat z oblíbených' : 'Přidat mezi oblíbené';
    btnOblibene.textContent = a.oblibene ? '★' : '☆';
    btnOblibene.addEventListener('click', () => prepniOznaceni(a.id, 'oblibene'));

    const btnNavstiveno = document.createElement('button');
    btnNavstiveno.className = 'ikona-oznaceni fajfka'
      + (a.navstivenoDne ? ' aktivni' : '')
      + (probihaUkladani.has(a.id + ':navstiveno') ? ' ukladani' : '');
    btnNavstiveno.type = 'button';
    btnNavstiveno.title = a.navstivenoDne ? 'Zrušit navštíveno' : 'Označit jako navštíveno';
    btnNavstiveno.textContent = a.navstivenoDne ? '✓' : '○';
    btnNavstiveno.addEventListener('click', () => prepniOznaceni(a.id, 'navstiveno'));

    vpravo.appendChild(skore);
    vpravo.appendChild(btnOblibene);
    vpravo.appendChild(btnNavstiveno);
    top.appendChild(nazev);
    top.appendChild(vpravo);
    el.appendChild(top);

    const meta = document.createElement('div');
    meta.className = 'meta';
    if (jeProbiha && a.datumOd) { const s = document.createElement('span'); s.textContent = '📅 od ' + a.datumOd; meta.appendChild(s); }
    else if (datumLabel) { const s = document.createElement('span'); s.textContent = '📅 ' + datumLabel; meta.appendChild(s); }
    if (a.misto) { const s = document.createElement('span'); s.textContent = '📍 ' + a.misto; meta.appendChild(s); }
    if (a.cas)   { const s = document.createElement('span'); s.textContent = '🕐 ' + a.cas;  meta.appendChild(s); }
    if (a.cena)  { const s = document.createElement('span'); s.textContent = '🎟 ' + a.cena; meta.appendChild(s); }
    if (a.dojezd){ const s = document.createElement('span'); s.textContent = '🚗 ' + a.dojezd; meta.appendChild(s); }
    if (a.navstivenoDne) {
      const s = document.createElement('span');
      s.className = 'navstiveno-info';
      s.textContent = '✓ navštíveno ' + a.navstivenoDne;
      meta.appendChild(s);
    }
    el.appendChild(meta);

    if (a.kategorie.length) {
      const badgeWrap = document.createElement('div');
      badgeWrap.style.cssText = 'margin-top:5px;display:flex;gap:4px;flex-wrap:wrap';
      a.kategorie.forEach(k => {
        const b = document.createElement('span');
        b.className = 'kat-badge';
        b.textContent = k;
        badgeWrap.appendChild(b);
      });
      el.appendChild(badgeWrap);
    }

    if (a.popis) {
      const p = document.createElement('div');
      p.className = 'popis';
      p.textContent = a.popis;
      el.appendChild(p);
    }

    const gcal = gcalUrl_(a);
    const akceDiv = document.createElement('div');
    akceDiv.className = 'karta-akce';
    if (a.url) {
      const link = document.createElement('a');
      link.href = a.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.className = 'btn-url';
      link.textContent = 'Více info →';
      link.addEventListener('click', (e) => otevritVNoveOknem_(e, a.url));
      akceDiv.appendChild(link);
    }
    if (gcal) {
      const link = document.createElement('a');
      link.href = gcal;
      link.target = '_blank';
      link.rel = 'noopener';
      link.className = 'btn-url';
      link.textContent = '📅 Do kalendáře';
      link.addEventListener('click', (e) => otevritVNoveOknem_(e, gcal));
      akceDiv.appendChild(link);
    }
    const btnSdilet = document.createElement('button');
    btnSdilet.type = 'button';
    btnSdilet.className = 'btn-url';
    btnSdilet.textContent = '📤 Sdílet';
    const mapa = mapsUrl_(a);
    if (mapa) {
      const link = document.createElement('a');
      link.href = mapa;
      link.target = '_blank';
      link.rel = 'noopener';
      link.className = 'btn-url';
      link.textContent = '📍 Mapa';
      link.addEventListener('click', (e) => otevritVNoveOknem_(e, mapa));
      akceDiv.appendChild(link);
    }
    btnSdilet.addEventListener('click', () => sdiletAkci_(a));
    akceDiv.appendChild(btnSdilet);
    el.appendChild(akceDiv);

    return el;
  }

  /** Sestaví odkaz na Google Kalendář (celodenní událost – strukturované časy
   *  chybí, viz backlog cas_od/cas_do). null, když datumOd nejde rozparsovat. */
  function gcalUrl_(a) {
    const od = parseCeskeDatum(a.datumOd);
    if (!od) return null;
    const doD = parseCeskeDatum(a.datumDo) || od;
    const konecExkluzivni = new Date(doD.getTime() + 86400000);   // GCal: end je exkluzivní
    const fmt = (d) => String(d.getFullYear()) + pad2_(d.getMonth() + 1) + pad2_(d.getDate());
    const detaily = [a.popis, a.url].filter(Boolean).join('\n');
    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: a.nazev || '',
      dates: fmt(od) + '/' + fmt(konecExkluzivni),
      location: a.misto || '',
      details: detaily,
    });
    return 'https://calendar.google.com/calendar/render?' + params.toString();
  }

  function pad2_(n) { return String(n).padStart(2, '0'); }

  /** PURE: sestaví text ke sdílení akce (název, datum, místo, odkaz) –
   *  oddělené od samotného window.navigator volání, aby šlo testovat v Node. */
  function sestavTextSdileni_(a) {
    const radky = [a.nazev || ''];
    const druhyRadek = [a.datumOd || '', a.misto || ''].filter(Boolean).join(' · ');
    if (druhyRadek) radky.push(druhyRadek);
    if (a.url) radky.push(a.url);
    return radky.join('\n');
  }

  /** Sdílení akce – tři úrovně odstupňovaného fallbacku, protože chování
   *  nativního Web Share API i schránky uvnitř sandboxovaného iframe Apps
   *  Scriptu není zaručené (stejná nejistota jako u window.open, viz iPad):
   *  1) navigator.share (mobil: nativní panel se seznamem aplikací – WhatsApp,
   *     SMS, e-mail…), 2) zkopírování do schránky, 3) prompt() s textem k
   *     ručnímu zkopírování jako poslední záchrana, když selže úplně vše. */
  async function sdiletAkci_(a) {
    const text = sestavTextSdileni_(a);
    if (navigator.share) {
      try {
        await navigator.share({ title: a.nazev || 'Kulturní radar', text });
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;   // uživatel sdílení sám zrušil
        // jinak pokračovat na fallback níže
      }
    }
    try {
      await navigator.clipboard.writeText(text);
      alert('Text akce zkopírován do schránky – vlož ho, kam chceš poslat.');
    } catch (e2) {
      prompt('Zkopíruj text akce (Ctrl+C / podrž prst a Kopírovat):', text);
    }
  }

  /** PURE: odkaz na Google Maps – oficiální dokumentované URL schéma
   *  (ne JS API), takže žádný API klíč ani placení, jen deep-link. Na mobilu
   *  otevře nativní appku Mapy, jinak web. null, když nemáme kam ukázat. */
  /** PURE: odkaz na Google Maps – oficiální dokumentované URL schéma
   *  (ne JS API), takže žádný API klíč ani placení, jen deep-link. Na mobilu
   *  otevře nativní appku Mapy, jinak web. Když má akce souřadnice (v3.14 –
   *  doplňují se na pozadí přes Nominatim), použije je → garantovaný pin bez
   *  ohledu na to, jak nejednoznačně text popisuje místo. Bez souřadnic
   *  (ještě negeokódováno, nebo Nominatim si s textem neporadil) spadne zpět
   *  na textové vyhledávání jako dřív. null, když nemáme kam ukázat vůbec. */
  function mapsUrl_(a) {
    if (typeof a.lat === 'number' && typeof a.lng === 'number') {
      return 'https://www.google.com/maps/search/?api=1&query=' + a.lat + ',' + a.lng;
    }
    const dotaz = [a.misto, a.obec].filter(Boolean).join(', ');
    if (!dotaz) return null;
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(dotaz);
  }

  /** Otevře odkaz v novém okně/záložce explicitním window.open() místo spoléhání
   *  jen na atribut target="_blank" – na iPadu (Safari uvnitř vnořeného
   *  sandboxovaného iframe, kterým Apps Script balí naši aplikaci) se
   *  target="_blank" podle zpětné vazby z 4. 8. 2026 ignoruje a otevře se
   *  detail ve stejné stránce.
   *
   *  BUG opravený 5. 8. 2026: window.open(url, '_blank', 'noopener') vrací
   *  null VŽDY, i při úspěchu (specifikace – noopener záměrně nedává žádnou
   *  vazbu zpět). Náš fallback (!okno → window.location.href = url) se tak
   *  spouštěl i po úspěšném otevření a přesměroval PŮVODNÍ stránku pryč na
   *  cizí web (uživatel to viděl jako „stránka spadla"). Bezpečnostní izolaci
   *  (ekvivalent noopener) teď zajišťuje okno.opener = null AŽ PO úspěšném
   *  otevření – tím window.open() vrací skutečnou referenci na úspěch a
   *  fallback se spustí jen při doopravdy zablokovaném vyskakovacím okně. */
  function otevritVNoveOknem_(e, url) {
    e.preventDefault();
    const okno = window.open(url, '_blank');
    if (okno) {
      okno.opener = null;
    } else {
      window.location.href = url;   // opravdu zablokováno pop-up blockerem
    }
  }

  // ── Render stálých míst ───────────────────────────────────
  let vsechnaMista = [];
  let aktMistoTyp = null;   // null = „Vše“, jinak konkrétní typ (zoo, jeskyně, …)

  function renderMista(mista) {
    vsechnaMista = mista;
    aktMistoTyp = null;
    prekreslitMista();
  }

  function prekreslitMista() {
    const main = document.getElementById('main');
    let sekce = document.getElementById('mista-sekce');
    if (!sekce) {
      sekce = document.createElement('div');
      sekce.id = 'mista-sekce';
      main.appendChild(sekce);
    }
    sekce.innerHTML = '';
    if (!vsechnaMista.length) return;

    const label = document.createElement('div');
    label.className = 'sekce-label';
    label.textContent = 'Stálá místa';
    sekce.appendChild(label);

    // Chipy typů se vykreslí, jen když má smysl filtrovat (2+ různých typů)
    const typy = [...new Set(vsechnaMista.map(m => m.typ).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'cs'));
    const zobrazitChipy = typy.length > 1;
    if (zobrazitChipy) {
      const chipsWrap = document.createElement('div');
      chipsWrap.className = 'chips';
      chipsWrap.style.marginBottom = '10px';
      const vseChip = document.createElement('button');
      vseChip.className = 'chip' + (aktMistoTyp === null ? ' active' : '');
      vseChip.textContent = 'Vše';
      vseChip.addEventListener('click', () => { aktMistoTyp = null; prekreslitMista(); });
      chipsWrap.appendChild(vseChip);
      typy.forEach(t => {
        const ch = document.createElement('button');
        ch.className = 'chip' + (aktMistoTyp === t ? ' active' : '');
        ch.textContent = t.charAt(0).toUpperCase() + t.slice(1);
        ch.addEventListener('click', () => { aktMistoTyp = t; prekreslitMista(); });
        chipsWrap.appendChild(ch);
      });
      sekce.appendChild(chipsWrap);
    }

    const filtrovana = aktMistoTyp ? vsechnaMista.filter(m => m.typ === aktMistoTyp) : vsechnaMista;
    const skupiny = {};
    filtrovana.forEach(m => { (skupiny[m.typ || 'ostatní'] = skupiny[m.typ || 'ostatní'] || []).push(m); });

    Object.keys(skupiny).sort((a, b) => a.localeCompare(b, 'cs')).forEach(typ => {
      if (zobrazitChipy) {
        const h = document.createElement('div');
        h.className = 'den-hlavicka';
        h.textContent = typ.charAt(0).toUpperCase() + typ.slice(1);
        sekce.appendChild(h);
      }
      skupiny[typ].forEach(m => {
        const el = document.createElement('div');
        el.className = 'misto-karta';
        const info = document.createElement('div');
        const n = document.createElement('div');
        n.className = 'misto-nazev';
        n.textContent = m.nazev;
        const mm = document.createElement('div');
        mm.className = 'misto-meta';
        // typ je vidět buď v hlavičce skupiny (chipy zapnuté), nebo tady – nikdy obojí
        mm.textContent = [zobrazitChipy ? null : m.typ, m.obec, m.doba].filter(Boolean).join(' · ');
        info.appendChild(n);
        info.appendChild(mm);
        const sk = document.createElement('div');
        sk.className = 'misto-skore';
        sk.textContent = '★ ' + (m.skore || '—');
        el.appendChild(info);
        el.appendChild(sk);
        sekce.appendChild(el);
      });
    });
  }

  // ── Kategorie chipy ───────────────────────────────────────
  function vytvorChip(text, aktivni) {
    const b = document.createElement('button');
    b.className = 'chip' + (aktivni ? ' active' : '');
    b.textContent = text;
    b.dataset.kat = text;
    return b;
  }

  function toggleKat(k) {
    if (aktKategorie.has(k)) aktKategorie.delete(k);
    else aktKategorie.add(k);
    rezimZobrazeni = 'vse';
    prekreslit();
  }

  function syncChipy() {
    document.querySelectorAll('#kat-chips .chip').forEach(ch => {
      const k = ch.dataset.kat;
      ch.classList.toggle('active', k === 'Vše' ? aktKategorie.size === 0 : aktKategorie.has(k));
    });
  }

  function syncSpecialChipy() {
    document.getElementById('chip-oblibene').classList.toggle('active', rezimZobrazeni === 'oblibene');
    document.getElementById('chip-navstivene').classList.toggle('active', rezimZobrazeni === 'navstivene');
    document.getElementById('obdobi-select').style.display = rezimZobrazeni === 'navstivene' ? '' : 'none';
  }

  /** Centrální překreslení podle aktuálního režimu (Vše / Oblíbené / Navštívené). */
  function prekreslit() {
    syncChipy();
    syncSpecialChipy();
    if (rezimZobrazeni === 'oblibene') {
      const seznam = vsechnaAkce
        .filter(a => a.oblibene)
        .sort((a, b) => dateKeyBezpecne_(a.datumOd) - dateKeyBezpecne_(b.datumOd));
      renderSpecialni(seznam, 'Zatím nemáte žádné oblíbené akce. Klikněte na ☆ u karty.');
    } else if (rezimZobrazeni === 'navstivene') {
      const seznam = filtrovatNavstivenaPodleObdobi_(vsechnaAkce, obdobiNavstivene, new Date());
      renderSpecialni(seznam, 'V tomto období nemáte žádné navštívené akce.');
    } else {
      renderAkce();
    }
  }

  /** Bezpečný časový klíč z českého data pro řazení; neparsovatelné jde na konec. */
  function dateKeyBezpecne_(s) {
    const d = parseCeskeDatum(s);
    return d ? d.getTime() : Number.MAX_SAFE_INTEGER;
  }

  /** PURE: akce navštívené v posledních N dnech (nebo „vse“), seřazené od
   *  nejnovější návštěvy. `ted` je injektované (ne Date.now() přímo), aby šlo
   *  otestovat hranice období bez závislosti na skutečném aktuálním čase. */
  function filtrovatNavstivenaPodleObdobi_(seznamAkci, obdobi, ted) {
    let seznam = seznamAkci.filter(a => a.navstivenoDne);
    if (obdobi !== 'vse') {
      const cutoff = new Date(ted.getTime() - Number(obdobi) * 86400000);
      seznam = seznam.filter(a => {
        const d = parseCeskeDatum(a.navstivenoDne);
        return d && d >= cutoff;
      });
    }
    seznam.sort((a, b) => dateKeyBezpecne_(b.navstivenoDne) - dateKeyBezpecne_(a.navstivenoDne));
    return seznam;
  }

  // ── ★ Oblíbené / ✓ Navštívené ──────────────────────────────
  const probihaUkladani = new Set();   // klíč id:typ – po dobu round-tripu na server

  async function prepniOznaceni(id, typ) {
    // v3.14: ★/✓ jsou osobní funkce – bez přihlášení otevřít login
    // s vysvětlením místo tichého serverového selhání.
    if (!prihlasenyUzivatel) {
      otevritLogin(typ === 'oblibene'
        ? 'Pro ukládání do ★ Oblíbených se prosím přihlas.'
        : 'Pro označování ✓ Navštívených se prosím přihlas.');
      return;
    }
    const a = vsechnaAkce.find(x => x.id === id);
    if (!a) return;
    // Optimistická odezva – přepnout hned, server potvrdí (nebo vrátí zpět).
    const puvodni = { oblibene: a.oblibene, navstivenoDne: a.navstivenoDne };
    if (typ === 'oblibene') a.oblibene = !a.oblibene;
    else a.navstivenoDne = a.navstivenoDne ? '' : 'právě teď';
    probihaUkladani.add(id + ':' + typ);
    prekreslit();
    try {
      const res = await gsr('apiToggle', id, typ, prihlasenyUzivatel ? prihlasenyUzivatel.id : '');
      if (res && res.ok) {
        a.oblibene = res.oblibene;
        a.navstivenoDne = res.navstivenoDne || '';
      } else {
        a.oblibene = puvodni.oblibene;
        a.navstivenoDne = puvodni.navstivenoDne;
        alert((res && res.error) || 'Označení se nepodařilo uložit.');
      }
    } catch (e) {
      a.oblibene = puvodni.oblibene;
      a.navstivenoDne = puvodni.navstivenoDne;
      alert('Chyba: ' + e.message);
    } finally {
      probihaUkladani.delete(id + ':' + typ);
      prekreslit();
    }
  }

  // ── FAB: Spustit kontrolu ─────────────────────────────────
  // v3.13: token dialog je sdílený – FAB i osobní hledání; poTokenu určuje,
  // co se po zadání tokenu spustí (výchozí je společná kontrola).
  let poTokenu = spustKontrolu;

  document.getElementById('fab').addEventListener('click', () => {
    if (!token) {
      poTokenu = spustKontrolu;
      document.getElementById('token-dialog').classList.add('open');
    } else {
      spustKontrolu(token);
    }
  });

  document.getElementById('token-cancel').addEventListener('click', () => {
    document.getElementById('token-dialog').classList.remove('open');
    poTokenu = spustKontrolu;
  });

  document.getElementById('token-ok').addEventListener('click', () => {
    const t = document.getElementById('token-input').value.trim();
    if (!t) return;
    token = t;
    localStorage.setItem('radar_token', t);
    document.getElementById('token-dialog').classList.remove('open');
    const akce = poTokenu; poTokenu = spustKontrolu;
    akce(t);
  });

  async function spustKontrolu(tok) {
    const fab = document.getElementById('fab');
    fab.disabled = true;
    fab.textContent = 'Spouštím…';
    try {
      const d = await gsr('apiSpustKontrolu', tok);
      if (d && d.ok) {
        fab.textContent = 'Spuštěno ✓';
        setTimeout(() => { fab.disabled = false; fab.textContent = 'Spustit kontrolu'; }, 15000);
      } else {
        alert((d && d.error) || 'Neznámá chyba');
        fab.disabled = false;
        fab.textContent = 'Spustit kontrolu';
        if (d && d.error && d.error.includes('token')) {
          localStorage.removeItem('radar_token');
          token = '';
        }
      }
    } catch (e) {
      alert('Chyba: ' + e.message);
      fab.disabled = false;
      fab.textContent = 'Spustit kontrolu';
    }
  }

  // ── Start ─────────────────────────────────────────────────
  // v3.14: appka startuje rovnou v plně funkčním anonymním režimu
  // (rozhodnutí 8. 8. 2026) – init() běží hned, přihlášení je na vyžádání
  // (badge "Přihlásit se", nebo pokus o ★/✓).
  init();
</script>
