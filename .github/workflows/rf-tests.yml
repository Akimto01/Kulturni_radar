name: RF testy (API + frontend)

on:
  workflow_dispatch:        # ruční spuštění z GitHubu
  schedule:
    # neděle 20:20 UTC (21:20 SEČ, 22:20 SELČ): po nedělním triggeru zpracovatSledovanaMesta
    # ve 20:00 místního času a mimo celou hodinu (GitHub doporučuje plánovat mimo začátek
    # hodiny, kdy je fronta plánovaných běhů nejvytíženější); cron je v UTC a nepřechází
    # na letní čas
    - cron: '20 20 * * 0'

# Dřív platilo výchozí oprávnění repa (read). contents: read stačí pro checkout,
# actions: write potřebuje poslední krok (gh workflow run publikovat-report.yml).
permissions:
  contents: read
  actions: write

jobs:
  rf-testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalace závislostí
        run: |
          pip install -r tests/robot/requirements.txt
          rfbrowser init chromium

      - name: API kontrakt
        env:
          RF_TEST_USER_ID: ${{ secrets.RF_TEST_USER_ID }}
          RF_TEST_PIN: ${{ secrets.RF_TEST_PIN }}
        # #78: v plánovaném běhu je prázdné 12h okno ntfy selhání, v ručním se test živosti přeskočí
        run: robot --variable BASE_URL:${{ secrets.RADAR_URL }} --variable NTFY_TOPIC:${{ secrets.NTFY_TOPIC }} --variable NTFY_VYZADOVAT_ZPRAVU:${{ github.event_name == 'schedule' }} --outputdir vysledky/api tests/robot/api.robot

      - name: Frontend E2E
        if: always()
        env:
          RF_TEST_USER_ID: ${{ secrets.RF_TEST_USER_ID }}
          RF_TEST_PIN: ${{ secrets.RF_TEST_PIN }}
        # Delší čekání na server jen v CI (Apps Script pod zátěží kolísá), lokální výchozí hodnoty v resources.robot
        run: robot --variable BASE_URL:${{ secrets.RADAR_URL }} --variable CEKANI_ZAPIS:30s --variable CEKANI_PRIHLASENI:40s --variable CEKANI_NAVIGACE:30s --outputdir vysledky/frontend tests/robot/frontend.robot

      # R5 (#42): smoke frontendu i v Apps Script iframu (/exec, sandboxovaný vstup), který
      # se jinak ověřoval jen ručně. SITE_URL a FRAME přes proměnné prostředí z resources.robot
      # (RADAR_SITE_URL, RF_FRAME), ať hodnota s mezerami a ">>>" nepotřebuje uvozovky.
      # Bez tagu krehky: mobilní kalendář a mapa kolísají už na statickém webu (dávka 10 #34).
      # Zbývají 4 testy: hlavička, přihlašovací obrazovka, karty s českými daty, stránka bez
      # JS chyby. Report jen jako artefakt (vysledky/frontend-iframe), na Pages se nepublikuje.
      - name: Frontend smoke přes Apps Script iframe
        if: always()
        env:
          RF_TEST_USER_ID: ${{ secrets.RF_TEST_USER_ID }}
          RF_TEST_PIN: ${{ secrets.RF_TEST_PIN }}
          RADAR_SITE_URL: ${{ secrets.RADAR_URL }}
          RF_FRAME: 'id=sandboxFrame >>> id=userHtmlFrame >>>'
        run: robot --include smoke --exclude krehky --variable BASE_URL:${{ secrets.RADAR_URL }} --variable CEKANI_ZAPIS:30s --variable CEKANI_PRIHLASENI:40s --variable CEKANI_NAVIGACE:30s --outputdir vysledky/frontend-iframe tests/robot/frontend.robot

      - name: Kontrola úniku tajných hodnot
        id: kontrola_uniku
        if: always()
        env:
          RF_TEST_PIN: ${{ secrets.RF_TEST_PIN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # Sdílený skript (#46), stejný jako v publikovat-report.yml; popis pravidel v něm.
        run: bash .github/scripts/kontrola-uniku.sh vysledky

      - name: Uložit reporty
        if: always() && steps.kontrola_uniku.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: rf-reporty
          path: vysledky/
          retention-days: 30

      - name: Upozornění na selhání (ntfy)
        # jen plánovaný běh; ruční běh sleduje ten, kdo ho spustil
        if: failure() && github.event_name == 'schedule'
        env:
          # vývojové upozornění: téma NTFY_TOPIC_DEV, dokud neexistuje, NTFY_TOPIC (RF test živosti kanálu appky zůstává na NTFY_TOPIC)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_DEV || secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS \
            -H "Title: Kulturni radar - vyvoj: tydenni RF testy selhaly" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -H "Click: $RUN_URL" \
            -d "Behy RF testu proti produkci skoncily chybou. Log a reporty: $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"

      # Trigger workflow_run v publikovat-report.yml se po plánovaných bězích 1. a 8. 11. 2026
      # vůbec nespustil (v repu žádný běh s událostí workflow_run), proto explicitní spuštění.
      # Musí běžet až po kroku „Uložit reporty“; publikovat-report.yml sám přeskočí běh bez
      # artefaktu rf-reporty (kontrola úniku selhala).
      - name: Spustit publikaci reportu na Pages
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publikovat-report.yml -f run_id=${{ github.run_id }}
