name: RF testy (API + frontend)

on:
  workflow_dispatch:        # ruční spuštění z GitHubu
  schedule:
    - cron: '0 19 * * 0'    # neděle 19:00 UTC – po samotestu radaru

jobs:
  rf-testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalace závislostí
        run: |
          pip install -r tests/robot/requirements.txt
          rfbrowser init chromium

      - name: API kontrakt
        run: robot --variable BASE_URL:${{ secrets.RADAR_URL }} --variable NTFY_TOPIC:${{ secrets.NTFY_TOPIC }} --outputdir vysledky/api tests/robot/api.robot

      - name: Frontend E2E
        if: always()
        env:
          RF_TEST_USER_ID: ${{ secrets.RF_TEST_USER_ID }}
          RF_TEST_PIN: ${{ secrets.RF_TEST_PIN }}
        run: robot --variable BASE_URL:${{ secrets.RADAR_URL }} --outputdir vysledky/frontend tests/robot/frontend.robot

      - name: Uložit reporty
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rf-reporty
          path: vysledky/
          retention-days: 30

      - name: Upozornění na selhání (ntfy)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS \
            -H "Title: Kulturni radar: tydenni RF testy selhaly" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -H "Click: $RUN_URL" \
            -d "Behy RF testu proti produkci skoncily chybou. Log a reporty: $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
