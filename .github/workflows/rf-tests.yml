name: RF testy (API + frontend)

on:
  workflow_dispatch:        # ruční spuštění z GitHubu
  schedule:
    # neděle 20:20 UTC (21:20 SEČ, 22:20 SELČ): po nedělním triggeru zpracovatSledovanaMesta
    # ve 20:00 místního času a mimo celou hodinu (GitHub doporučuje plánovat mimo začátek
    # hodiny, kdy je fronta plánovaných běhů nejvytíženější); cron je v UTC a nepřechází
    # na letní čas
    - cron: '20 20 * * 0'

jobs:
  rf-testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalace závislostí
        run: |
          pip install -r tests/robot/requirements.txt
          rfbrowser init chromium

      - name: API kontrakt
        run: robot --variable BASE_URL:${{ secrets.RADAR_URL }} --variable NTFY_TOPIC:${{ secrets.NTFY_TOPIC }} --outputdir vysledky/api tests/robot/api.robot

      - name: Frontend E2E
        if: always()
        env:
          RF_TEST_USER_ID: ${{ secrets.RF_TEST_USER_ID }}
          RF_TEST_PIN: ${{ secrets.RF_TEST_PIN }}
        # Delší čekání na server jen v CI (Apps Script pod zátěží kolísá), lokální výchozí hodnoty v resources.robot
        run: robot --variable BASE_URL:${{ secrets.RADAR_URL }} --variable CEKANI_ZAPIS:30s --variable CEKANI_PRIHLASENI:40s --variable CEKANI_NAVIGACE:30s --outputdir vysledky/frontend tests/robot/frontend.robot

      - name: Kontrola úniku tajných hodnot
        id: kontrola_uniku
        if: always()
        env:
          RF_TEST_PIN: ${{ secrets.RF_TEST_PIN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # Repo je veřejné, artefakty si může stáhnout kdokoli přihlášený. Při nálezu
          # se vypíše jen název souboru a secretu, nikdy hodnota.
          # Hledá se ve všech textových souborech. Část řetězců v log.html a report.html
          # je komprimovaná, ale RF je generuje z output.xml, takže únik v nich by byl
          # vždy i v output.xml, kde je text prostý.
          # PIN má mít 8 znaků, takže stačí prosté hledání. Kratší PIN by dával falešné
          # shody (kód knihovny v HTML, zlomky časů, čísla): v tom případě se krok
          # ohlásí jako ::warning:: a hledá se jen v uvozovkách nebo jako celý text prvku.
          # playwright-log.txt je ladicí log Browser Library: zapisuje i hodnoty vrácené
          # z DOM a úroveň logování RF ho neovlivní. Do reportů nepatří, proto se maže.
          find vysledky -name playwright-log.txt -delete 2>/dev/null || true
          nalez=0
          # Ntfy témata uživatelských profilů (radar- + 32 hex, apiVygenerovatNtfyTema_)
          # se nesmí objevit v žádném reportu, ať jde o kohokoli.
          while IFS= read -r soubor; do
            echo "::error::Únik ntfy tématu uživatelského profilu (radar-…) v souboru $soubor"
            nalez=1
          done < <(grep -rlE -- 'radar-[0-9a-f]{32}' vysledky/ || true)
          if [ -n "$NTFY_TOPIC" ]; then
            while IFS= read -r soubor; do
              echo "::error::Únik tajné hodnoty NTFY_TOPIC v souboru $soubor"
              nalez=1
            done < <(grep -rlF -- "$NTFY_TOPIC" vysledky/ || true)
          fi
          if [ -n "$RF_TEST_PIN" ]; then
            if [ "${#RF_TEST_PIN}" -ge 8 ]; then
              hledani=(-e "$RF_TEST_PIN")
            else
              echo "::warning::RF_TEST_PIN má méně než 8 znaků, kontrola úniku PINu je jen přibližná (hledá se v uvozovkách a jako celý text prvku)"
              hledani=(-e "'$RF_TEST_PIN'" -e "\"$RF_TEST_PIN\"" -e ">$RF_TEST_PIN<")
            fi
            while IFS= read -r soubor; do
              echo "::error::Únik tajné hodnoty RF_TEST_PIN v souboru $soubor"
              nalez=1
            done < <(grep -rlF "${hledani[@]}" -- vysledky/ || true)
          fi
          exit $nalez

      - name: Uložit reporty
        if: always() && steps.kontrola_uniku.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: rf-reporty
          path: vysledky/
          retention-days: 30

      - name: Upozornění na selhání (ntfy)
        # jen plánovaný běh; ruční běh sleduje ten, kdo ho spustil
        if: failure() && github.event_name == 'schedule'
        env:
          # vývojové upozornění: téma NTFY_TOPIC_DEV, dokud neexistuje, NTFY_TOPIC (RF test živosti kanálu appky zůstává na NTFY_TOPIC)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_DEV || secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS \
            -H "Title: Kulturni radar - vyvoj: tydenni RF testy selhaly" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -H "Click: $RUN_URL" \
            -d "Behy RF testu proti produkci skoncily chybou. Log a reporty: $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
