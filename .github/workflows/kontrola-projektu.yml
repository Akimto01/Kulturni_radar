name: Kontrola projektu (board, defekty, návrh práce)

# Automatický běh kontrol z .github/scripts (kontrola-boardu.py, kontrola-defektu.py,
# navrh-session.py). Skripty jen čtou. Board je uživatelský projekt Akimto01 a výchozí
# GITHUB_TOKEN ho nepřečte, proto secret BOARD_READ_TOKEN: classic token jen se scope
# read:project, platnost do 27. 1. 2027 (obnova: issue "Obnovit BOARD_READ_TOKEN").
# Zdůvodnění a rizika: Docs/kvalita/DEFEKTY.md, kapitola Kontrola úplnosti.
#
# Režimy:
#   denni    ticho, notifikace jen při chybě kontroly, defektu P1 nebo P2 po lhůtě
#            nebo termínu dnes či v minulosti; klepnutí na notifikaci otevře běh (Click)
#   pondeli  vždy souhrn: krátká notifikace na jednu obrazovku, plný přehled v issue
#            „Přehled projektu (automaticky)“ (štítek prehled; telefon job summary nezobrazuje)
#            a jako doplněk v souhrnu běhu; klepnutí na notifikaci otevře to issue
#            (důvody denního režimu, pokud jsou, jdou na začátek jako „Naléhavé“, s jeho prioritou)
# Plánovaný běh: denně 6:40 UTC (7:40 SEČ, 8:40 SELČ; mimo celou hodinu, cron je v UTC bez
# letního času), v pondělí automaticky režim pondeli. Ruční běh: režim se vybírá.
#
# Tři joby, protože oprávnění GITHUB_TOKEN se v Actions nastavují na úrovni jobu, ne kroku:
#   kontrola   čte board (BOARD_READ_TOKEN jen v kroku se skripty), sestaví zprávu; nic nezapisuje
#   prehled    jen pondělí; jediný job s issues: write, přepíše tělo issue s přehledem
#   oznameni   odešle ntfy (téma NTFY_TOPIC_DEV, dokud neexistuje, NTFY_TOPIC) až po zápisu přehledu, ať je issue aktuální,
#              než na notifikaci někdo klepne; při selhání zápisu míří Click na běh
# Issue s přehledem (štítek prehled) je zavřené a zamčené, skripty kontrola-boardu.py
# a navrh-session.py ho ignorují.

on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:
    inputs:
      rezim:
        description: 'Režim kontroly'
        type: choice
        options:
          - denni
          - pondeli
        default: denni

permissions:
  contents: read

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rezim: ${{ steps.rezim.outputs.rezim }}
      odeslat: ${{ steps.zprava.outputs.odeslat }}
      titulek: ${{ steps.zprava.outputs.titulek }}
      priorita: ${{ steps.zprava.outputs.priorita }}
      tagy: ${{ steps.zprava.outputs.tagy }}
      zprava: ${{ steps.zprava.outputs.zprava }}
      prehled: ${{ steps.zprava.outputs.prehled }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Určit režim
        id: rezim
        env:
          UDALOST: ${{ github.event_name }}
          VSTUP: ${{ inputs.rezim }}
        run: |
          if [ "$UDALOST" = "workflow_dispatch" ]; then
            R="$VSTUP"
          elif [ "$(date -u +%u)" = "1" ]; then
            R=pondeli
          else
            R=denni
          fi
          echo "Režim: $R"
          echo "rezim=$R" >> "$GITHUB_OUTPUT"

      # Token jen pro tento krok. Skripty končí kódem 1 při nálezu (to je v pořádku, výsledek
      # je v JSON); selhání samotné kontroly (např. vypršelý token) pozná další krok podle
      # neplatného JSON.
      - name: Spustit kontroly (token jen pro čtení)
        env:
          GH_TOKEN: ${{ secrets.BOARD_READ_TOKEN }}
        run: |
          python .github/scripts/kontrola-boardu.py --json > "$RUNNER_TEMP/board.json" || true
          python .github/scripts/kontrola-defektu.py --json > "$RUNNER_TEMP/defekty.json" || true
          python .github/scripts/navrh-session.py --cas 3h --json > "$RUNNER_TEMP/navrh.json" || true

      - name: Sestavit zprávu
        id: zprava
        env:
          REZIM: ${{ steps.rezim.outputs.rezim }}
        run: |
          python .github/scripts/sestav-notifikaci.py --rezim "$REZIM" \
            --board "$RUNNER_TEMP/board.json" --defekty "$RUNNER_TEMP/defekty.json" \
            --navrh "$RUNNER_TEMP/navrh.json" --vystup "$RUNNER_TEMP/zprava.txt" \
            --prehled "$RUNNER_TEMP/prehled.md" > "$RUNNER_TEMP/meta.json"
          # plný přehled (jen pondělní režim) i do souhrnu běhu, jako doplněk pro desktop
          if [ -s "$RUNNER_TEMP/prehled.md" ]; then cat "$RUNNER_TEMP/prehled.md" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "odeslat=$(jq -r .odeslat "$RUNNER_TEMP/meta.json")" >> "$GITHUB_OUTPUT"
          echo "titulek=$(jq -r .titulek "$RUNNER_TEMP/meta.json")" >> "$GITHUB_OUTPUT"
          echo "priorita=$(jq -r .priorita "$RUNNER_TEMP/meta.json")" >> "$GITHUB_OUTPUT"
          echo "tagy=$(jq -r .tagy "$RUNNER_TEMP/meta.json")" >> "$GITHUB_OUTPUT"
          # víceřádkové výstupy: text zprávy a přehledu (jen čísla a názvy issues z veřejného repa)
          vystup() {
            D="KONEC_$(openssl rand -hex 8)"
            { echo "$1<<$D"; cat "$2" 2>/dev/null || true; echo; echo "$D"; } >> "$GITHUB_OUTPUT"
          }
          vystup zprava "$RUNNER_TEMP/zprava.txt"
          vystup prehled "$RUNNER_TEMP/prehled.md"

  prehled:
    needs: kontrola
    if: needs.kontrola.outputs.rezim == 'pondeli'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # jediný job s právem zápisu: jen issues, nic jiného
    permissions:
      issues: write
    outputs:
      url: ${{ steps.zapis.outputs.url }}
    steps:
      - name: Přepsat issue s přehledem
        id: zapis
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREHLED: ${{ needs.kontrola.outputs.prehled }}
        run: |
          N=$(gh issue list --repo "$REPO" --label prehled --state all --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$N" ]; then
            echo "Issue se štítkem prehled neexistuje (založit: Přehled projektu (automaticky), zavřené a zamčené)."
            exit 1
          fi
          printf '%s\n' "$PREHLED" > "$RUNNER_TEMP/prehled.md"
          gh issue edit "$N" --repo "$REPO" --body-file "$RUNNER_TEMP/prehled.md"
          echo "Přepsáno issue #$N"
          echo "url=https://github.com/$REPO/issues/$N" >> "$GITHUB_OUTPUT"

  oznameni:
    needs: [kontrola, prehled]
    # prehled může být přeskočený (denní režim) nebo selhat; notifikace odejde i tak
    if: always() && needs.kontrola.result == 'success' && needs.kontrola.outputs.odeslat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Odeslat notifikaci (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_DEV || secrets.NTFY_TOPIC }}
          TITULEK: ${{ needs.kontrola.outputs.titulek }}
          PRIORITA: ${{ needs.kontrola.outputs.priorita }}
          TAGY: ${{ needs.kontrola.outputs.tagy }}
          ZPRAVA: ${{ needs.kontrola.outputs.zprava }}
          # pondělí: issue s přehledem; jinak (denní režim, selhaný zápis) běh workflow
          CLICK: ${{ needs.prehled.outputs.url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          printf '%s' "$ZPRAVA" | curl -fsS \
            -H "Title: $TITULEK" \
            -H "Priority: $PRIORITA" \
            -H "Tags: $TAGY" \
            -H "Click: $CLICK" \
            --data-binary @- \
            "https://ntfy.sh/$NTFY_TOPIC"

  selhani:
    needs: [kontrola, prehled]
    # jen plánovaný běh; ruční běh sleduje ten, kdo ho spustil
    if: always() && github.event_name == 'schedule' && (needs.kontrola.result == 'failure' || needs.prehled.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upozornění na selhání kontroly (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_DEV || secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS \
            -H "Title: Kulturni radar - vyvoj: kontrola projektu selhala" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -H "Click: $RUN_URL" \
            -d "Automaticka kontrola projektu skoncila chybou (casta pricina: vyprseny BOARD_READ_TOKEN, viz issue Obnovit BOARD_READ_TOKEN; u pondeli take chybejici issue se stitkem prehled). Log: $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
