name: Node testy (rychlé jednotkové testy)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node-testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Spustit testy
        run: node --test tests/unit.test.js tests/frontend.test.js
