name: Node testy (rychlé jednotkové testy)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node-testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Pokrytí řádků backendu (kulturni_radar.gs) se zatím jen vypisuje, bez prahu.
      - name: Spustit testy
        env:
          TZ: Europe/Prague
        run: node --test --experimental-test-coverage tests/unit.test.js tests/frontend.test.js

      # Tabulka výše u Index.html není spolehlivá (víc skriptů téhož souboru), skutečné
      # pokrytí frontendu počítá tento skript ze syrových dat V8. Zatím jen výpis.
      - name: Pokrytí frontendu (Index.html)
        run: node tests/pokryti-frontendu.js

  # Dry run RF sady (nález z přípravy quality checku 7.-8. 10. 2026): ověří
  # syntaxi .robot souborů a názvy/argumenty keywordů bez přístupu k produkci,
  # takže je levný a nezávislý na stavu Apps Scriptu. Prohlížeče se
  # nestahují (--skip-browsers), stačí Node závislosti Browser knihovny.
  # Omezení: dry run nevyhodnocuje proměnné, překlep v ${PROMENNE} nechytí.
  rf-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/robot/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalace RF závislostí (bez prohlížečů)
        run: |
          pip install -r tests/robot/requirements.txt
          rfbrowser init --skip-browsers

      - name: RF dry run (syntaxe a argumenty keywordů, bez sítě)
        run: robot --dryrun --output NONE --report NONE --log NONE tests/robot/

      # Pojistka proti nárůstu porušení pravidel z Docs/testovani/ARCHITEKTURA-TESTU.md
      # (ratchet): spočítá porušení, která jdou hlídat automaticky, a selže, jen
      # když některý počet vzroste proti baseline-architektury-testu.json.
      # Soubory jen čte, nic nespouští proti produkci. Plán oprav: Docs/audity/AUDIT-SOULADU-TESTU.md.
      - name: Pojistka souladu testů s architekturou (ratchet)
        run: python .github/scripts/kontrola-architektury-testu.py

      # README je jediný zdroj počtů testů: tabulka „Testy v číslech“ se porovná
      # se skutečností (Node, RF přes robot.api, worker). Při rozdílu selže.
      - name: Kontrola počtů testů v README
        run: python .github/scripts/kontrola-poctu-testu.py

      # README obsahuje soupis nástrojů a technologií: každý nástroj, který repo používá
      # (balíčky z package.json a requirements.txt, knihovny RF, akce třetích stran, clasp,
      # wrangler, api-tests/, unpkg), musí mít v tabulce řádek. Nejdřív samotest skriptu
      # (včetně negativních zkoušek), pak ostrá kontrola. Jen čtou, stačí standardní knihovna.
      - name: Kontrola soupisu nástrojů v README
        run: |
          python .github/scripts/kontrola-nastroju.py --test
          python .github/scripts/kontrola-nastroju.py

      # Samotest pravidla „uzavřený defekt S1 nebo S2 má řádek v HISTORIE-INCIDENTU.md“ (vymyšlená
      # data, bez sítě a tokenu). Ostrou kontrolu defektů dělá kontrola-projektu.yml s BOARD_READ_TOKEN.
      - name: Samotest kontroly defektů
        run: python .github/scripts/kontrola-defektu.py --test

      # Samotest varování „kód změněn, dokument ne“ (dočasné git repo, jen varování, bez sítě) a
      # kontrola, že mapa kód -> dokument v repu je celá (dokumenty a funkce existují). Samotest
      # ověřuje mapu v repu i sám (poslední zkouška), takže při rozbité mapě selže.
      - name: Samotest varování kód změněn, dokument ne
        run: python .github/scripts/kontrola-dokumentace-kodu.py --test

      # Dokumentace: relativní odkazy a kotvy (#nadpis) vedou na existující cíl, každý .md v Docs/
      # je v rozcestníku Docs/README.md, všech 11 rolí má řádek a „plánováno #N“ ukazuje na otevřené
      # issue (zavřené je jen varování). Nejdřív samotest s negativními zkouškami, pak ostrá kontrola.
      # Jen čte, stačí standardní knihovna; issues čte gh s výchozím tokenem.
      - name: Kontrola odkazů a rozcestníku dokumentace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/kontrola-dokumentace.py --test
          python .github/scripts/kontrola-dokumentace.py

      # Lint s baseline (ratchet): Robocop nad tests/robot/ a ruff nad .github/scripts/. Nástroje jsou
      # v samostatném .github/requirements-lint.txt (tests/robot/requirements.txt instaluje týdenní běh
      # rf-tests.yml a nesmí se měnit), s omezením `-c`, aby se robotframework nezměnil. Konfigurace
      # .github/robocop.toml a .github/ruff.toml (vypnutá pravidla se zdůvodněním), počty nálezů podle
      # pravidla v .github/scripts/baseline-lint.json. CI selže jen při nárůstu; samotest ověří, že nový
      # nález v dočasném souboru selže a beze změny projde.
      - name: Lint (Robocop a ruff s baseline)
        run: |
          pip install -r .github/requirements-lint.txt -c tests/robot/requirements.txt
          python .github/scripts/kontrola-lintu.py --test
          python .github/scripts/kontrola-lintu.py
