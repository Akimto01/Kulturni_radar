name: Cloudflare Worker testy (email-webhook, izolované od hlavní Node sady)

on:
  push:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/cloudflare-worker-tests.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/cloudflare-worker-tests.yml'
  workflow_dispatch:

jobs:
  cloudflare-worker-testy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalace závislostí (jen cloudflare-worker/, vlastní package-lock.json)
        run: npm ci

      - name: Spustit testy
        run: npm test
